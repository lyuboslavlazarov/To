<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Зона за хранене</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/theme/staff.css">
</head>
<body>
<header class="top">
  <a class="home" href="/">🎡</a>
  <h1>🍔 Зона за хранене</h1>
  <span class="clock"></span>
</header>
<main class="layout-side">
  <section>
    <div id="products"></div>
  </section>

  <aside>
    <div class="scan"><span class="icon">▥</span><input id="scan" placeholder="Сканирайте картата…" autocomplete="off"></div>

    <div class="panel" style="margin-top:16px" id="cardBox">
      <div class="muted center pulse">Няма сканирана карта</div>
    </div>

    <div class="panel" style="margin-top:16px">
      <div class="row"><h3 class="grow" style="margin:0">Поръчка</h3><button class="ghost sm" id="clear">Изчисти</button></div>
      <div id="cart"></div>
      <div class="total"><span>Общо</span><span id="total">0 т.</span></div>
      <div id="after" class="muted"></div>
      <button class="primary xl" id="pay" style="width:100%; margin-top:12px" disabled>Плати с точки</button>
    </div>

    <div class="panel" style="margin-top:16px">
      <h3>Последни поръчки</h3>
      <div class="scroll" style="max-height:30vh"><table><tbody id="recent"></tbody></table></div>
    </div>
  </aside>
</main>

<script src="/common.js"></script>
<script src="/camera.js"></script>
<script>
const STATION = station('Хранене');
let products = [];
const cart = new Map(); // product_id -> qty
let card = null;
let idleTimer;

async function loadProducts() {
  products = await api('GET', '/api/products');
  const cats = new Map();
  for (const p of products) {
    const c = p.category || 'Продукти';
    if (!cats.has(c)) cats.set(c, []);
    cats.get(c).push(p);
  }
  $('#products').innerHTML = [...cats].map(([c, list]) => `
    <div class="cat-title">${esc(c)}</div>
    <div class="products">${list.map((p) => `
      <button class="product" data-id="${p.id}">
        <span>${esc(p.name)}</span>
        <span class="row" style="width:100%"><span class="pts grow">${p.points} т.</span><span class="badge qty-badge hidden"></span></span>
      </button>`).join('')}</div>`).join('')
    || '<div class="panel muted">Няма активни продукти. Добавете ги от <a href="/admin.html">Администрация</a>.</div>';
  $$('.product').forEach((b) => b.addEventListener('click', () => add(Number(b.dataset.id), 1)));
  // премахване на продукти, които вече не са активни
  for (const id of [...cart.keys()]) if (!products.some((p) => p.id === id)) cart.delete(id);
  render();
}

function add(id, d) {
  const q = (cart.get(id) || 0) + d;
  if (q <= 0) cart.delete(id); else cart.set(id, q);
  bumpIdle();
  render();
}

function total() {
  let t = 0;
  for (const [id, q] of cart) { const p = products.find((x) => x.id === id); if (p) t += p.points * q; }
  return t;
}

function render() {
  const lines = [...cart].map(([id, q]) => ({ p: products.find((x) => x.id === id), q })).filter((l) => l.p);
  $('#cart').innerHTML = lines.map(({ p, q }) => `
    <div class="cart-line">
      <span class="n">${esc(p.name)}<div class="muted small">${p.points} т. × ${q}</div></span>
      <button class="sm ghost" data-m="${p.id}">−</button><span class="q">${q}</span><button class="sm ghost" data-p="${p.id}">+</button>
      <span style="min-width:60px" class="right"><b>${p.points * q}</b></span>
    </div>`).join('') || '<p class="muted">Докоснете продукт, за да го добавите.</p>';
  $$('[data-m]').forEach((b) => b.addEventListener('click', () => add(Number(b.dataset.m), -1)));
  $$('[data-p]').forEach((b) => b.addEventListener('click', () => add(Number(b.dataset.p), 1)));
  $$('.product').forEach((b) => {
    const q = cart.get(Number(b.dataset.id)) || 0;
    b.classList.toggle('in-cart', q > 0);
    const badge = $('.qty-badge', b);
    badge.textContent = '× ' + q;
    badge.classList.toggle('hidden', q === 0);
  });
  const t = total();
  $('#total').textContent = pts(t);
  if (card) {
    const left = card.balance - t;
    $('#after').innerHTML = left >= 0
      ? `Остават след плащане: <b class="ok">${pts(left)}</b>`
      : `<b class="bad">Недостатъчно точки – липсват ${pts(-left)}</b>`;
  } else $('#after').textContent = cart.size ? 'Сканирайте картата, за да платите.' : '';
  $('#pay').disabled = !card || !cart.size || card.balance < t || card.blocked;
}

function showCard() {
  if (!card) { $('#cardBox').innerHTML = '<div class="muted center pulse">Няма сканирана карта</div>'; return; }
  $('#cardBox').innerHTML = `
    <div class="row"><div class="grow"><div class="big">${esc(card.name || 'Без име')}</div><div class="muted">${esc(card.barcode)}</div></div>
    <button class="ghost sm" id="dropCard">✕</button></div>
    <div style="margin-top:8px">Баланс: <span class="big" style="color:var(--accent)">${pts(card.balance)}</span></div>
    ${card.games && card.games.limited ? `<div class="muted">Остават игри: <b style="color:${gamesColor(card.games)}">${card.games.remaining}</b> от ${card.games.allowed}</div>` : ''}
    ${card.replaced_by ? `<span class="badge bad">ЗАМЕНЕНА С ${esc(card.replaced_by)}</span>` : card.blocked ? '<span class="badge bad">БЛОКИРАНА</span>' : ''}
    <div id="cardOrders" style="margin-top:10px"></div>`;
  $('#dropCard').addEventListener('click', () => { card = null; showCard(); render(); });
  loadCardOrders();
}

// Днешните поръчки на сканираната карта – за връщане, ако клиентът се откаже
async function loadCardOrders() {
  if (!card) return;
  const code = card.barcode;
  try {
    const h = await api('GET', `/api/cards/${encodeURIComponent(code)}/history`);
    if (!card || card.barcode !== code) return;
    const t = todayStr();
    const list = h.purchases.filter((p) => !p.voided && p.ts.startsWith(t));
    const box = $('#cardOrders');
    if (!box) return;
    box.innerHTML = list.length ? `<div class="muted small" style="margin-bottom:4px">Днешни поръчки:</div>` + list.map((p) => `
      <div class="row" style="padding:6px 0; border-top:1px solid var(--line); gap:8px">
        <span class="grow small">${fmtTime(p.ts)} · ${p.items.map((i) => `${i.qty}× ${esc(i.name)}`).join(', ')}
          ${(p.refunds || []).map((r) => `<div class="ok small">↩ върнати ${r.points} т. (${esc(r.items)})</div>`).join('')}</span>
        <b>−${p.total}</b>
        <button class="sm ghost" data-refund-card="${p.id}">↩ Върни</button>
      </div>`).join('') : '';
    $$('[data-refund-card]', box).forEach((b) => b.addEventListener('click', () => {
      const p = list.find((x) => String(x.id) === b.dataset.refundCard);
      openRefund({ ...p, name: h.card.name });
    }));
  } catch { /* ignore */ }
}

// Прозорец за връщане: цялата поръчка или част от нея
function openRefund(p) {
  document.querySelectorAll('.modal-bg').forEach((m) => m.remove());
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  const lines = p.items.filter((i) => i.qty > 0);
  bg.innerHTML = `<div class="modal" style="width:min(560px,100%)">
    <div class="row"><h2 class="grow" style="margin:0">↩ Връщане на точки</h2><button class="ghost" data-close>✕</button></div>
    <p class="muted" style="margin-top:6px">${esc(p.name || p.barcode)} · ${esc(p.barcode)} · поръчка от ${fmtTime(p.ts)} · ${p.total} т.</p>
    <p class="small">Изберете какво връща клиентът:</p>
    ${lines.map((i) => `<div class="cart-line">
      <span class="n">${esc(i.name)}<div class="muted small">${i.points} т. × ${i.qty}</div></span>
      <button class="sm ghost" data-m="${i.id}">−</button><span class="q" data-q="${i.id}">${i.qty}</span><button class="sm ghost" data-p="${i.id}">+</button>
    </div>`).join('')}
    <label>Причина</label>
    <select data-reason>
      <option>Отказ от храната</option><option>Грешна поръчка</option><option>Продуктът свърши</option><option>Друго</option>
    </select>
    <div class="total"><span>Връщат се</span><span data-sum></span></div>
    <button class="primary xl" data-do style="width:100%">↩ Върни точките</button></div>`;
  document.body.appendChild(bg);
  const qty = Object.fromEntries(lines.map((i) => [i.id, i.qty]));
  const upd = () => {
    let sum = 0;
    for (const i of lines) { bg.querySelector(`[data-q="${i.id}"]`).textContent = qty[i.id]; sum += qty[i.id] * i.points; }
    bg.querySelector('[data-sum]').textContent = pts(sum);
    const b = bg.querySelector('[data-do]');
    b.disabled = sum === 0 && !lines.some((i) => qty[i.id] > 0);
    b.textContent = `↩ Върни ${pts(sum)}`;
  };
  bg.querySelectorAll('[data-m]').forEach((b) => b.addEventListener('click', () => { const id = b.dataset.m; qty[id] = Math.max(0, qty[id] - 1); upd(); }));
  bg.querySelectorAll('[data-p]').forEach((b) => b.addEventListener('click', () => {
    const id = b.dataset.p; const max = lines.find((i) => String(i.id) === id).qty; qty[id] = Math.min(max, qty[id] + 1); upd();
  }));
  bg.addEventListener('click', (e) => { if (e.target === bg || e.target.hasAttribute('data-close')) bg.remove(); });
  bg.querySelector('[data-do]').addEventListener('click', async (e) => {
    e.target.disabled = true;
    try {
      const items = lines.filter((i) => qty[i.id] > 0).map((i) => ({ id: i.id, qty: qty[i.id] }));
      if (!items.length) throw new Error('Изберете поне един продукт');
      const r = await api('POST', `/api/purchases/${p.id}/refund`, { items, reason: bg.querySelector('[data-reason]').value, station: STATION });
      beep(true);
      bg.remove();
      toast(`Върнати ${pts(r.refunded)} на ${p.name || p.barcode} · нов баланс ${pts(r.card.balance)}`, 'ok', 5000);
      if (card && card.barcode === r.card.barcode) { card = r.card; showCard(); render(); }
      loadRecent();
    } catch (err) { e.target.disabled = false; beep(false); toast(err.message, 'bad', 5000); }
  });
  upd();
}

async function onScan(code) {
  try {
    card = await api('GET', '/api/cards/' + encodeURIComponent(code));
    beep(!card.blocked);
    if (card.replaced_by) toast(`Картата е изгубена и заменена с ${card.replaced_by}`, 'bad', 5000);
    else if (card.blocked) toast('Картата е блокирана', 'bad');
  } catch (e) { beep(false); toast(e.message, 'bad', 4000); card = null; }
  bumpIdle();
  showCard();
  render();
}

async function pay() {
  if (!card || !cart.size) return;
  $('#pay').disabled = true;
  try {
    const items = [...cart].map(([product_id, qty]) => ({ product_id, qty }));
    const r = await api('POST', '/api/purchases', { barcode: card.barcode, items, station: STATION });
    beep(true);
    toast(`Платено ${pts(r.total)} · остават ${pts(r.card.balance)}`, 'ok', 4000);
    cart.clear();
    card = r.card;
    showCard();
    render();
    loadRecent();
    // картата се изчиства автоматично след малко
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { card = null; showCard(); render(); }, 6000);
  } catch (e) {
    beep(false); toast(e.message, 'bad', 4000);
    try { card = await api('GET', '/api/cards/' + encodeURIComponent(card.barcode)); } catch { /* ignore */ }
    showCard(); render();
  }
}

function bumpIdle() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { card = null; cart.clear(); showCard(); render(); }, 120000);
}

async function loadRecent() {
  try {
    const rows = await api('GET', '/api/recent?type=purchases&limit=20');
    $('#recent').innerHTML = rows.map((r) => `<tr class="${r.voided ? 'voided' : ''}">
      <td>${fmtTime(r.ts)}</td>
      <td><b>${esc(r.name || r.barcode)}</b><div class="muted small">${r.items.map((i) => `${i.qty}× ${esc(i.name)}`).join(', ')}</div>
        ${(r.refunds || []).map((x) => `<div class="ok small">↩ върнати ${x.points} т. (${esc(x.items)})</div>`).join('')}</td>
      <td class="right">${r.voided ? 'върната' : '−' + r.total}</td>
      <td>${r.can_refund ? `<button class="sm ghost" data-refund="${r.id}" title="Връщане на точки">↩</button>` : ''}</td></tr>`).join('') || '<tr><td class="muted">Няма поръчки</td></tr>';
    $$('#recent [data-refund]').forEach((b) => b.addEventListener('click', () => openRefund(rows.find((x) => String(x.id) === b.dataset.refund))));
  } catch { /* ignore */ }
}

$('#pay').addEventListener('click', pay);
$('#clear').addEventListener('click', () => { cart.clear(); render(); });

loadProducts().then(loadRecent).catch((e) => toast(e.message, 'bad'));
setInterval(() => loadProducts().catch(() => {}), 60000);
bindScanner($('#scan'), onScan);
</script>
</body>
</html>
